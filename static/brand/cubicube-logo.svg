<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <linearGradient id="markGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#markGradient)"/>
    <circle cx="16" cy="18" r="4" fill="#ffffff"/>
    <circle cx="28" cy="18" r="4" fill="#ffffff"/>
    <rect x="15" y="30" width="18" height="6" rx="3" fill="rgba(255, 255, 255, 0.7)"/>
  </g>

  <!-- Wordmark -->
  <text x="62" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="2" fill="#dfe6f2">
    CUBICUBE
  </text>
  <text x="62" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="3" fill="#dfe6f2" opacity="0.6">
    BUILD YOUR CUBI
  </text>
</svg>
