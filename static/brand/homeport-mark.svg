<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 64 64"
	role="img"
	aria-labelledby="homeport-title"
	width="64"
	height="64"
>
	<title id="homeport-title">Homeport</title>
	<defs>
		<linearGradient id="hp-stroke" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#4de3ff" />
			<stop offset="55%" stop-color="#9ae37a" />
			<stop offset="100%" stop-color="#ffd86b" />
		</linearGradient>
		<radialGradient id="hp-anchor" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#4de3ff" stop-opacity="1" />
			<stop offset="70%" stop-color="#4de3ff" stop-opacity="0.85" />
			<stop offset="100%" stop-color="#4de3ff" stop-opacity="0" />
		</radialGradient>
	</defs>

	<!-- Badge: rounded square, subtle inner fill for depth on dark bg -->
	<rect
		x="3"
		y="3"
		width="58"
		height="58"
		rx="14"
		ry="14"
		fill="#0a0f1f"
		stroke="url(#hp-stroke)"
		stroke-width="2"
	/>
	<rect
		x="6"
		y="6"
		width="52"
		height="52"
		rx="11"
		ry="11"
		fill="none"
		stroke="#ffffff"
		stroke-opacity="0.05"
		stroke-width="1"
	/>

	<!-- Delegation tree, optically centered (visual center ~ y=34) -->
	<g fill="none" stroke="#4de3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<!-- Vertical stem from anchor to junction -->
		<path d="M32 46 L32 26" />
		<!-- Three branches out to terminals -->
		<path d="M32 26 L20 18" />
		<path d="M32 26 L32 14" />
		<path d="M32 26 L44 18" />
	</g>

	<!-- Terminal nodes (delegated agents) -->
	<g fill="#0a0f1f" stroke="#9ae37a" stroke-width="2">
		<circle cx="20" cy="18" r="2.5" />
		<circle cx="32" cy="14" r="2.5" />
		<circle cx="44" cy="18" r="2.5" />
	</g>

	<!-- Anchor: filled circle (the human) with a soft halo -->
	<circle cx="32" cy="46" r="8" fill="url(#hp-anchor)" opacity="0.35" />
	<circle cx="32" cy="46" r="4.5" fill="#4de3ff" />
	<circle cx="32" cy="46" r="4.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" />
</svg>
