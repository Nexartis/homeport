#
# gitleaks configuration for homeport.
#
# GENERATED BY the GITLEAKS-HISTORY remediation workstream (2026-10-02) after a
# full-history `gitleaks detect` review. Every finding in this repo's history was
# individually inspected and classified as a NON-SECRET: a unit-test fixture,
# a golden test vector, a docs example, an environment-variable *name*, a git
# commit SHA, a non-secret identifier, or a gitleaks rule artifact that spans
# source code between two PEM header literals. No production credential was found,
# so git history is deliberately NOT rewritten and no rotation is required.
#
# The default ruleset stays the baseline (`[extend] useDefault = true`). Every
# allowlist below requires ALL of its criteria to hold (`condition = "AND"`) and
# is scoped to the exact file path that owns the finding; value entries pin one
# exact secret value. Nothing is ignored by directory or glob, and no rule is
# disabled, so a NEW secret — even on the same line shape or in the same file —
# still fails the scan loudly.
#
# Verify (expect: no leaks found, exit 0):
#   gitleaks detect --no-banner --source . --exit-code 1

[extend]
useDefault = true

[[rules]]
id = "curl-auth-header"

[[rules.allowlists]]
description = "Verified non-secret curl-auth-header value(s) in src/routes/docs/billing/+page.svelte"
condition = "AND"
regexTarget = "secret"
paths = ['''^src/routes/docs/billing/\+page\.svelte$''']
regexes = ['''^nanda_YOUR_KEY$''']

[[rules.allowlists]]
description = "Verified non-secret curl-auth-header value(s) in src/routes/docs/developers/+page.svelte"
condition = "AND"
regexTarget = "secret"
paths = ['''^src/routes/docs/developers/\+page\.svelte$''']
regexes = ['''^nanda_YOUR_KEY_HERE$''']

[[rules.allowlists]]
description = "Verified non-secret curl-auth-header value(s) in src/routes/docs/webhooks/+page.svelte"
condition = "AND"
regexTarget = "secret"
paths = ['''^src/routes/docs/webhooks/\+page\.svelte$''']
regexes = ['''^nanda_YOUR_KEY$''']

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Verified non-secret generic-api-key value(s) in docs/secret-provisioning.md"
condition = "AND"
regexTarget = "secret"
paths = ['''^docs/secret\-provisioning\.md$''']
regexes = ['''^ed25519_private_key_v1$''']

[[rules.allowlists]]
description = "Verified non-secret generic-api-key value(s) in src/lib/utils/node-secrets.ts"
condition = "AND"
regexTarget = "secret"
paths = ['''^src/lib/utils/node\-secrets\.ts$''']
regexes = [
  '''^ed25519_private_key_v1$''',
  '''^ed25519_private_key_v2$''',
]

[[rules.allowlists]]
description = "Verified non-secret generic-api-key value(s) in src/routes/admin/keys/+page.svelte"
condition = "AND"
regexTarget = "secret"
paths = ['''^src/routes/admin/keys/\+page\.svelte$''']
regexes = ['''^ed25519_private_key_v2$''']

[[rules.allowlists]]
description = "Verified non-secret generic-api-key value(s) in tests/certifier.test.ts"
condition = "AND"
regexTarget = "secret"
paths = ['''^tests/certifier\.test\.ts$''']
