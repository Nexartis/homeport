condition = "AND"
regexTarget = "secret"
paths = ['''^tests/federation\-v2\.test\.ts$''']
regexes = ['''^env\.KYM_NANDA_ED25519_PRIVATE_KEY_v1$''']

[[rules.allowlists]]
description = "Verified non-secret generic-api-key value(s) in tests/secret-provisioning-config.test.ts"
condition = "AND"
regexTarget = "secret"
